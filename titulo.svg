<svg xmlns="http://w3.org" viewBox="0 0 600 50" width="100%" height="50">
  <style>
    .text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 30px;
      font-weight: 700;
      fill: #24292f;
    }
    @media (prefers-color-scheme: dark) {
      .text { fill: #f0f6fc; }
    }
  </style>

  <text class="text" x="0" y="35">
    <!-- Animação Nativa: Alterna o texto a cada 4 segundos -->
    <animate 
      attributeName="string" 
      values="Christian Martinkoski;Desenvolvedor Backend;Analista de Garantia;17 anos;Christian Martinkoski" 
      dur="16s" 
      repeatCount="indefinite" />
  </text>
</svg>
