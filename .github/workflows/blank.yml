name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # Executa todo dia à meia-noite
  workflow_dispatch: # Permite rodar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. Atualizado de @v4 para @v5 (Suporte nativo ao Node 24)
      - uses: actions/checkout@v5
      
      # 2. Atualizado de @v3 para @v3.5.0 ou superior (Corrigido para Node 24)
      - uses: Platane/snk@v3.5.0
        id: snake-gif
        with:
          github_user_name: Ykwim-77
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # 3. Atualizado de @v4 para @v5 (Suporte nativo ao Node 24)
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
