name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # Executa todo dia à meia-noite
  workflow_dispatch: # Permite rodar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      
      - uses: Platane/snk@v3.5.0
        id: snake-gif
        with:
          github_user_name: Ykwim-77
          # Configuração avançada de cores para remover o fundo branco e desacelerar
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#00FFCC&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF007F&color_dots=#0d1117,#161b22,#21262d,#30363d,#8b949e
